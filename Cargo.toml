[package]
name = "r2factor"
version = "0.1.11"
edition = "2024"
licence = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yaml_serde = "0.10"
syn = { version = "3", features = ["full", "extra-traits", "visit", "visit-mut"] }
tokensave = { version = "7" }
tokio = { version = "1", features = ["rt", "macros"] }
regex = "1"
ureq = { version = "3", features = ["json"] }
libsql = "0.9.30"
tempfile = "3"

[dev-dependencies]
